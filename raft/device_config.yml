#
# python_raft device config (auto-loaded via rack_config includes, or
# --deviceConfig) — the canonical python_raft shape:
#     deviceConfig: > cpe1: > platform: / model: / prompt:
#
# One cpe entry per platform named by a rack_config slot; python_raft matches on
# `platform`. HOST-ONLY: python_raft reads platform/model/prompt to drive the
# target and the `conformance` block to raise the slot, deploy, launch, collect
# results and drop the slot again. Nothing on the target reads this file.
#
# Two pairs of commands, and the difference between them is where they run.
# `slotUp`/`slotDown` run on the HOST and make the target exist at all (start a
# container, boot a VM); `launch`/`teardown` run ON the target, once it does.
#
# The capability gate is NOT here — it is the platform's HFP, named by
# `conformance.hfp` (a URL). The host fetches the HFP and ships the resolved file
# to the target, which loads it with `-p`.
#
# Testing NEVER builds (issue #104). `conformance.package` names a PREBUILT
# tarball produced by ./build.sh. `deploy: none` says the engineer installed it
# on the target themselves and raft should just run.
#
# raft is GIVEN the target by config and has NO concept of the platform; the
# suite never branches on platform identity. Swapping the backend = editing this
# config (and pointing `hfp` at that platform's HFP), never the tests. Schema:
# ../profiles/deviceConfig.schema.yaml. HFP schema: ../profiles/hfp.schema.yaml.

deviceConfig:
  # --- the software Rialto emulator, inside the SC container -----------------
  # The backend underneath is the software Rialto built by ../build-rialto.sh
  # (NATIVE_BUILD), not a SoC. ../emulator.sh installs it as /opt/rialto in the
  # container and puts an sshd in front, so this slot is reached over ssh like
  # any other. Standing that container up IS this slot's `slotUp`, so a run
  # against it is just ./test.sh — the caller never handles the container.
  #
  # Once it is up, launch-target.sh starts RialtoServerManagerSim, activates the
  # app and waits for the session-server socket, then writes the resolved
  # environment (socket path, plugin paths, sim host/port) to target-env.sh for
  # the run.
  #
  # The container is headless, so the platform ranks the fake sinks to MAX: the
  # RialtoServer's playbin leaves audio-sink/video-sink unset and autodetect has
  # no display or audio device to find. That is a property of THIS platform, so
  # it rides on its launch command — the launch hands it to the run via
  # target-env.sh, and no other slot sees it.
  cpe1:
    platform: "linux-emulator"
    model: "native-software"
    prompt: "$ "

    conformance:
      installDir: "/opt/rialto-conformance"
      binary:     "rialto_conformance"
      resultsDir: "/opt/rialto-conformance/results"
      hfp: "file://profiles/hfp.linux.yaml"        # the Linux software platform's HFP

      deploy:  "fetch"
      package: "build/dist/rialto-conformance-*.tar.gz"

      # Slot lifecycle — run on the HOST, from the repo root. slotUp runs before
      # anything connects (there is no target until it has), slotDown after the
      # run ends, whatever the verdict. Both are cases in their own right.
      # ./test.sh --keep-slot leaves the slot up for a debugging session.
      slotUp:   "./emulator.sh up"
      slotDown: "./emulator.sh down"

      launch:   "GST_PLUGIN_FEATURE_RANK=fakevideosink:MAX,fakeaudiosink:MAX ./launch-target.sh"
      teardown: "./teardown-target.sh"
      envFile:  "target-env.sh"

  # --- a render-capable Linux VM / box ---------------------------------------
  # Rialto is expected to be installed and running already, so nothing is
  # launched. A box where the software Rialto was stood up with build-rialto.sh
  # instead brings its session server up per run, the way the emulator does:
  #
  #   launch:   "RIALTO_PREFIX=/opt/rialto ./launch-target.sh"
  #   teardown: "./teardown-target.sh"
  #   envFile:  "target-env.sh"
  #
  # That prefix has to be on the system loader path (/etc/ld.so.conf.d + ldconfig)
  # — the server manager spawns the session server with an environment of its own,
  # so an LD_LIBRARY_PATH set here never reaches it.
  cpe2:
    platform: "linux-native"
    model: "linux-box"
    prompt: "$ "

    conformance:
      installDir: "/opt/rialto-conformance"
      binary:     "rialto_conformance"
      resultsDir: "/opt/rialto-conformance/results"
      hfp: "file://profiles/hfp.linux.yaml"

      deploy:  "fetch"
      package: "build/dist/rialto-conformance-*.tar.gz"

      # The box is already on, so the run neither raises it nor drops it. A box
      # that does need waking (a VM to boot, a power switch to throw) names the
      # host-side commands for it here and gets the same two cases.
      slotUp:   ""
      slotDown: ""

      launch:   ""
      teardown: ""
      envFile:  ""

  # --- real targets -----------------------------------------------------------
  cpe3:
    platform: "reference-target"   # config-named target instance — not a SoC family
    model: "reference"
    prompt: "root@target:~#"

    conformance:
      installDir: "/opt/rialto-conformance"
      binary: "rialto_conformance"
      resultsDir: "/opt/rialto-conformance/results"
      hfp: "https://<platform-owner>/hfp/reference-target.yaml"   # URL of this platform's HFP

      deploy:  "fetch"
      package: "build/dist/rialto-conformance-*.tar.gz"

      slotUp:   ""
      slotDown: ""

      launch:   ""
      teardown: ""
      envFile:  ""

  cpe4:
    platform: "lab-target-1"
    model: "lab"
    prompt: "root@target:~#"

    conformance:
      installDir: "/opt/rialto-conformance"
      binary: "rialto_conformance"
      resultsDir: "/opt/rialto-conformance/results"
      hfp: "https://<platform-owner>/hfp/lab-target-1.yaml"

      deploy:  "fetch"
      package: "build/dist/rialto-conformance-*.tar.gz"

      slotUp:   ""
      slotDown: ""

      launch:   ""
      teardown: ""
      envFile:  ""
