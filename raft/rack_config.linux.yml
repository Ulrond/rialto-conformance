#
# python_raft rack config for a LINUX Rialto box — a render-capable x86 VM (its
# video sink actually renders, unlike the headless software platform) or a local
# software Rialto. The box is just another slot: raft reaches it over the console
# and has no concept of the platform.
#
# The box must already be running a Rialto server the deployed conformance binary
# connects to. Swapping the box = editing the slot `ip` below, never the tests.
#
# Run (the friendly entry wraps this):
#   ./run-linux.sh
#   python_venv/bin/python raft/suites/test_rialto_conformance.py \
#       --config raft/rack_config.linux.yml --rack rack1 --slotName linux-native
#
# The linux-native platform's HFP + host-orchestration inputs come from the
# included ../profiles/deviceConfig.linux.yaml (its `conformance.hfp` points at
# profiles/hfp.linux.yaml). The host fetches the HFP and ships the resolved file;
# the target consumes only that.

globalConfig:
  includes:
    deviceConfig: "../profiles/deviceConfig.linux.yaml"
  local:
    log:
      directory: "./logs"

rackConfig:
  rack1:
    # The Linux Rialto box. Selected by --slotName. EDIT the console `ip`/`username`
    # to point at the render-capable VM (or leave localhost for a box on this host).
    linux-native:
      devices:
        - dut:
            platform: "linux-native"
            consoles:
              - default:
                  type: "ssh"
                  enabled: true
                  ip: "127.0.0.1"        # EDIT: the render-capable Linux VM (or localhost)
                  port: 22
                  username: "rialto"     # EDIT: the box's login user
                  prompt: "$ "
